checkpoint:
  output_dir: outputs

runtime:
  device:
    device: cuda:0
  precision:
    dtype: float32
    amp_enabled: false
    amp_dtype: float16
  reproducibility:
    seed: 42
    allow_tf32: true
    deterministic: false
  training:
    log_every_steps: 50

tokenizer:
  source:
    pretrained_model: bert-base-uncased
  sequence:
    max_sequence_length: 128

model:
  hidden_state_dimension: 256
  output_classes_count: 3
  loop:
    max_iterations: 6
    time_rope_base_frequency: 4.8
  dropout:
    token: 0.00
    embedding: 0.10
    attention: 0.10
    residual: 0.10
    ffn: 0.10
    classifier: 0.10
    controller: 0.10
    stochastic_depth: 0.05
  transformer:
    swi_glu_ffn_dimension: 704
    gelu_ffn_dimension: 1024
    attention_heads_count: 8
  halting:
    hazard_baseline_offset: -2.0
    hazard_baseline_scale: -2.0
    hazard_adjustment_scale: 0.9

training:
  resume_from: null
