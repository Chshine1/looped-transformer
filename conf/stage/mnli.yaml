# @package training.stage

id: backbone_warmup
type: looped_mnli
options:
  epochs: 6
  frozen_patterns: '^_halting_cell\.'
  evaluation_patterns: '^_halting_cell(?:\.|$)'
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 1
  save_every_epochs: 1
data_options:
  seed: 42
  file_path: data/mnli_train.tsv
  batch_size: 200
  premise_column: sentence1
  hypothesis_column: sentence2
  label_column: gold_label
  shuffle_cache_dir: data/shuffled
  shuffle_chunk_size: 10000
teacher:
  pretrained_model: cross-encoder/nli-deberta-v3-base
  revision: main
  max_sequence_length: 128
  dtype: float16
  local_files_only: false
  label_order: [ contradiction, entailment, neutral ]
loss_options:
  type: anchored_sampled_loop_cross_entropy
  sampled_loops: [ 3, 4, 5 ]
  sampled_weights: [ 1.0, 1.0, 1.0 ]
  sampled_loss_scale: 0.20
  label_smoothing: 0.05
  time_rope_regularization_scale: 0.01
  distillation_scale: 0.0
  teacher_temperature: 2.0
optimizer_options:
  learning_rates:
    '_attn_res\._residual_scale': 0.0001
    '_loop\._transformer_block[12]\._(?:attention|ffn)_residual_scale': 0.0001
    '_attn_res': 0.0001
    '_attn_res\._[qk]_proj': 0.0003
    '_attn_res\._(?:v|out)_proj': 0.0004
    '_token_embedding': 0.00005
    '_segment_embedding': 0.00005
    '_loop\._transformer_block[12]\._normalization[12]': 0.0002
    '_loop\._transformer_block[12](?:\..*)?': 0.0004
    '_loop\._loop_normalization': 0.0002
    '_classify_normalization': 0.0002
    '_classifier': 0.0005
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  epsilon: 0.00000001
scheduler_options:
  type: warmup_cosine
  warmup_ratio: 0.06
  warmup_start_factor: 0.1
  minimum_learning_rate_factor: 0.1
