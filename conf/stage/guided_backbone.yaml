# @package training.stage

id: controller_guided_backbone
type: controller_guided_backbone
source_checkpoint: ???
controller_checkpoint: ???
options:
  epochs: 1
  frozen_patterns: '^_backbone\._halting_cell\.'
  evaluation_patterns: '^_backbone\._halting_cell(?:\.|$)'
  max_gradient_norm: 1.0
  gradient_accumulation_steps: 5
  save_every_epochs: 1
data_options:
  seed: 42
  file_path: data/mnli_train.tsv
  batch_size: 40
  premise_column: sentence1
  hypothesis_column: sentence2
  label_column: gold_label
  shuffle_cache_dir: data/shuffled
  shuffle_chunk_size: 10000
guidance_options:
  temperature: 0.35
  neighbor_smoothing: 0.2
  uniform_smoothing: 0.05
loss_options:
  type: controller_weighted_loop_cross_entropy
  label_smoothing: 0.05
  time_rope_regularization_scale: 0.01
optimizer_options:
  learning_rates:
    '_backbone\._attn_res\._residual_scale': 0.000025
    '_backbone\._loop\._transformer_block[12]\._(?:attention|ffn)_residual_scale': 0.000025
    '_backbone\._attn_res': 0.000025
    '_backbone\._attn_res\._[qk]_proj': 0.000075
    '_backbone\._attn_res\._(?:v|out)_proj': 0.0001
    '_backbone\._token_embedding': 0.0001
    '_backbone\._loop\._transformer_block[12]\._normalization[12]': 0.00005
    '_backbone\._loop\._transformer_block[12](?:\..*)?': 0.0001
    '_backbone\._loop\._loop_normalization': 0.00005
    '_backbone\._classify_normalization': 0.00005
    '_backbone\._classifier': 0.000125
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.999
  epsilon: 0.00000001
scheduler_options:
  type: warmup_cosine
  warmup_ratio: 0.06
  warmup_start_factor: 0.1
  minimum_learning_rate_factor: 0.1
