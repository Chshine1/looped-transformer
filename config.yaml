runtime:
  device: cuda
  cuda_device_index: 0
  dtype: float32
  amp_enabled: true
  amp_dtype: float16
  seed: 42
  allow_tf32: true
  deterministic: false

data:
  train_file_path: data/mnli_train.tsv
  eval_file_path: data/mnli_matched.tsv
  output_dir: outputs
  batch_size: 32
  premise_column: sentence1
  hypothesis_column: sentence2
  label_column: gold_label
  shuffle_cache_dir: data/shuffled
  shuffle_chunk_size: 600

model:
  hidden_state_dimension: 256
  output_classes_count: 3
  max_iterations: 6
  max_sequence_length: 128
  dropout: 0.1
  residual_scaling:
    mode: static
    expected_iterations: 6.0
    multiplier: 1.0  # coefficient = multiplier / (expected_iterations * sqrt(2))
  transformer:
    swi_glu_ffn_dimension: 704
    gelu_ffn_dimension: 1024
    attention_heads_count: 8
  halting:
    hazard_baseline_offset: -2.0
    hazard_baseline_scale: -2.0
    hazard_adjustment_scale: 0.9
  training:
    log_every_steps: 50
    stages:
      - backbone_warmup
    stage_templates:
      backbone_warmup:
        type: looped_mnli
        common:
          epochs: 4
          frozen_patterns: '^_halting_cell\.'
          evaluation_patterns: '^_halting_cell(?:\.|$)'
          max_gradient_norm: 1.0
          gradient_accumulation_steps: 1
          save_every_epochs: 1
        optimizer:
          learning_rates:
            '^$': 0.001
            '_loop_normalization': 0.0005
            '_token_embedding': 0.0005
            '_input_injection(?:\..*)?': 0.0005
            '_transformer_block[12](?:\..*)?': 0.0005
            '_classify_normalization': 0.0005
            '_classifier': 0.0005
          weight_decay: 0.01
          beta1: 0.9
          beta2: 0.999
          epsilon: 0.00000001
        scheduler:
          type: warmup_cosine
          warmup_ratio: 0.06
          warmup_start_factor: 0.1
          minimum_learning_rate_factor: 0.1
        loss:
          type: mean_loop_cross_entropy
      depth_training:
        type: looped_mnli
        common:
          epochs: 8
          frozen_patterns: '^_halting_cell\.'
          evaluation_patterns: '^_halting_cell(?:\.|$)'
          max_gradient_norm: 1.0
          gradient_accumulation_steps: 1
          save_every_epochs: 1
        optimizer:
          learning_rates:
            '^$': 0.0003
            '_loop_normalization': 0.0002
            '_token_embedding': 0.0002
            '_input_injection(?:\..*)?': 0.0002
            '_transformer_block[12](?:\..*)?': 0.0002
            '_classify_normalization': 0.0002
            '_classifier': 0.0002
          weight_decay: 0.01
          beta1: 0.9
          beta2: 0.999
          epsilon: 0.00000001
        scheduler:
          type: warmup_cosine
          warmup_ratio: 0.02
          warmup_start_factor: 0.5
          minimum_learning_rate_factor: 0.1
        loss:
          type: depth_weighted_cross_entropy
          depth_weight_growth: 0.5
          monotonic_loss_scale: 0.2
      controller_training:
        type: looped_mnli
        common:
          epochs: 2
          frozen_patterns: '^(?!_halting_cell\.).*'
          evaluation_patterns: '^(?!_halting_cell(?:\.|$)).*'
          max_gradient_norm: 1.0
          gradient_accumulation_steps: 1
          save_every_epochs: 1
        optimizer:
          learning_rates:
            '_halting_cell(?:\..*)?': 0.0005
          weight_decay: 0.01
          beta1: 0.9
          beta2: 0.999
          epsilon: 0.00000001
        scheduler:
          type: warmup_constant
          warmup_ratio: 0.05
          warmup_start_factor: 0.1
        loss:
          type: oracle_halting
          compute_cost: 0.02
          target_temperature: 0.1
      joint:
        type: looped_mnli
        common:
          epochs: 4
          frozen_patterns: '(?!)'
          evaluation_patterns: '(?!)'
          max_gradient_norm: 1.0
          gradient_accumulation_steps: 1
          save_every_epochs: 1
        optimizer:
          learning_rates:
            '_halting_cell(?:\..*)?': 0.0002
            '_input_injection(?:\..*)?': 0.0001
            '^$': 0.0001
            '_loop_normalization': 0.00005
            '_token_embedding': 0.00005
            '_transformer_block[12](?:\..*)?': 0.00005
            '_classify_normalization': 0.00005
            '_classifier': 0.00005
          weight_decay: 0.01
          beta1: 0.9
          beta2: 0.999
          epsilon: 0.00000001
        scheduler:
          type: warmup_cosine
          warmup_ratio: 0.02
          warmup_start_factor: 0.5
          minimum_learning_rate_factor: 0.1
        loss:
          type: adaptive_joint
          compute_cost: 0.02
          target_temperature: 0.1
          controller_loss_scale: 0.1
          depth_loss_scale: 0.1
          depth_weight_growth: 0.5
          monotonic_loss_scale: 0.2
  evaluation:
    halt_hazard_threshold: 0.6
    halt_survival_threshold: 0.05
    batch_size: 64
    evaluate_every_epochs: 1
