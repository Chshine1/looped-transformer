runtime:
  device: cuda
  cuda_device_index: 0
  dtype: float32
  amp_enabled: false
  amp_dtype: float16
  seed: 42
  allow_tf32: true
  deterministic: false

model:
  hidden_state_dimension: 256
  output_classes_count: 3
  max_iterations: 6
  max_sequence_length: 128
  dropout:
    token: 0.00
    embedding: 0.10
    attention: 0.10
    residual: 0.10
    ffn: 0.10
    classifier: 0.10
    controller: 0.10
    stochastic_depth: 0.05
  transformer:
    swi_glu_ffn_dimension: 704
    gelu_ffn_dimension: 1024
    attention_heads_count: 8
  halting:
    hazard_baseline_offset: -2.0
    hazard_baseline_scale: -2.0
    hazard_adjustment_scale: 0.9
  training:
    log_every_steps: 50
    stages:
      - backbone_warmup
    stage_templates:
      backbone_warmup:
        type: looped_mnli
        common:
          epochs: 6
          frozen_patterns: '^_halting_cell\.'
          evaluation_patterns: '^_halting_cell(?:\.|$)'
          max_gradient_norm: 1.0
          gradient_accumulation_steps: 1
          save_every_epochs: 1
          data:
            seed: 42
            file_path: data/mnli_train.tsv
            output_dir: outputs
            batch_size: 256
            premise_column: sentence1
            hypothesis_column: sentence2
            label_column: gold_label
            shuffle_cache_dir: data/shuffled
            shuffle_chunk_size: 10000
        optimizer:
          learning_rates:
            '_attn_res\._residual_scale': 0.0001
            '_loop\._transformer_block[12]\._(?:attention|ffn)_residual_scale': 0.0001
            '_attn_res': 0.0001
            '_attn_res\._[qk]_proj': 0.0003
            '_attn_res\._(?:v|out)_proj': 0.0004
            '_token_embedding': 0.0004
            '_loop\._transformer_block[12]\._normalization[12]': 0.0002
            '_loop\._transformer_block[12](?:\..*)?': 0.0004
            '_loop\._loop_normalization': 0.0002
            '_classify_normalization': 0.0002
            '_classifier': 0.0005
          weight_decay: 0.01
          beta1: 0.9
          beta2: 0.999
          epsilon: 0.00000001
        scheduler:
          type: warmup_cosine
          warmup_ratio: 0.06
          warmup_start_factor: 0.1
          minimum_learning_rate_factor: 0.1
        loss:
          type: anchored_sampled_loop_cross_entropy
          sampled_loops: [3, 4, 5]
          sampled_weights: [1.0, 1.0, 1.0]
          sampled_loss_scale: 0.20
          label_smoothing: 0.05
          time_rope_regularization_scale: 0.01
