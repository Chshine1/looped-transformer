runtime:
  device: cuda
  cuda_device_index: 0
  dtype: float32
  amp_enabled: true
  amp_dtype: float16
  seed: 42
  allow_tf32: true
  deterministic: false

data:
  train_file_path: data/mnli_train.tsv
  eval_file_path: data/mnli_matched.tsv
  output_dir: outputs
  batch_size: 32
  premise_column: sentence1
  hypothesis_column: sentence2
  label_column: gold_label
  shuffle_cache_dir: data/shuffled
  shuffle_chunk_size: 600

model:
  hidden_state_dimension: 256
  output_classes_count: 3
  max_iterations: 6
  max_sequence_length: 128
  dropout: 0.1
  transformer:
    swi_glu_ffn_dimension: 704
    gelu_ffn_dimension: 1024
    attention_heads_count: 8
  halting:
    residue_time_scaling: 0.75
    hazard_baseline_offset: -2.0
    hazard_baseline_scale: -2.0
    hazard_adjustment_scale: 0.9
  training:
    log_every_steps: 50
    stages:
      - default
    stage_templates:
      default:
        type: looped_mnli
        common:
          epochs: 50
          frozen_patterns: "(?!)"
          max_gradient_norm: 1.0
          gradient_accumulation_steps: 1
          save_every_epochs: 1
        optimizer:
          learning_rates:
            ".*": 0.00003
          weight_decay: 0.01
          beta1: 0.9
          beta2: 0.999
          epsilon: 0.00000001
        scheduler:
          warmup_ratio: 0.1
          warmup_start_factor: 0.1
          minimum_learning_rate: 0.000001
        loss:
          expected_halting_time: 4
          halting_loss_scale: 0.05
          auxiliary_loss_scale: 0.1
  evaluation:
    halt_hazard_threshold: 0.6
    halt_survival_threshold: 0.05
    batch_size: 64
    evaluate_every_epochs: 1
