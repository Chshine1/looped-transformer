[project]
authors = [{ name = "Chshine1", email = "chshine@qq.com" }]
dependencies = ["pydantic>=2.14.1,<3", "pyyaml>=6.0", "torch", "hydra-core>=1.3.7,<2", "lagom>=2.7.7,<3"]
name = "looped-transformer"
requires-python = ">= 3.12"
version = "0.1.0"

[project.scripts]
looped-transformer = "looped_transformer.app.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "default-win-64", platform = "win-64", cuda = "12.0" },
    { name = "default-linux-64", platform = "linux-64", cuda = "12.0" }
]

[tool.pixi.environments]
default = { features = ["cu126"] }
fallback = { features = ["cu124"] }
dev = { features = ["cu126", "dev", "clutrr-data"] }

[tool.pixi.pypi-dependencies]
looped_transformer = { path = ".", editable = true }

[tool.pixi.environments.clutrr-data]
features = ["clutrr-data"]
no-default-feature = true

[tool.pixi.feature.clutrr-data.pypi-dependencies]
clutrr = { path = "./.data-sources/clutrr-v1.3", editable = true }

[tool.pixi.feature.cu126.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.feature.cu124.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu124" }

[tool.pixi.feature.clutrr-data.dependencies]
python = ">=3.12,<3.14"
hydra-core = ">=1.3,<1.4"
matplotlib-base = ">=3.10,<4"
networkx = ">=3.4,<4"
nltk = ">=3.9,<4"
pandas = ">=2.2,<4"
pyyaml = ">=6.0,<7"
requests = ">=2.32,<3"
rich = ">=13.9,<16"
scikit-learn = ">=1.6,<2"
tqdm = ">=4.67,<5"
pydantic = ">=2.14.2,<3"

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
transformers = ">=5.18.0,<6"
tokenizers = ">=0.23.1,<0.24"

[tool.pixi.feature.dev.dependencies]
pixi-pycharm = ">=0.0.12,<0.0.13"
ruff = ">=0.16.10,<0.17"
pyrefly = ">=1.3.2,<2"
types-pyyaml = ">=6.0.12.20260906,<7"

[tool.pyrefly]
project-includes = ["src", "tests", "scripts"]
search-path = ["scripts", ".data-sources/clutrr-v1.3"]
project-excludes = [
    "**/__pycache__",
    ".pixi",
]
python-version = "3.13"

[tool.ruff]
target-version = "py313"
src = ["src", "scripts"]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pixi.tasks]
train = "looped-transformer --config-dir conf train"

[tool.pixi.feature.dev.tasks]
typecheck = { cmd = "pyrefly check", default-environment = "dev" }
format = { cmd = "python -m ruff format .", default-environment = "dev" }
lint = { cmd = "python -m ruff check .", default-environment = "dev" }
test = { cmd = "python -m unittest discover -s tests -v", default-environment = "dev" }

[tool.pixi.feature.clutrr-data.tasks]
prepare-clutrr = { cmd = "python -m clutrr_generation --log-level INFO --log-file generation.log", cwd = "scripts", default-environment = "clutrr-data" }
