[project]
authors = [{ name = "Chshine1", email = "chshine@qq.com" }]
dependencies = ["pydantic>=2.14.1,<3", "pyyaml>=6.0", "torch", "hydra-core>=1.3.7,<2", "lagom>=2.7.7,<3"]
name = "looped-transformer"
requires-python = ">= 3.12"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    { name = "default-win-64", platform = "win-64", cuda = "12.0" },
    { name = "default-linux-64", platform = "linux-64", cuda = "12.0" }
]

[tool.pixi.environments]
default = { features = ["cu126"] }
fallback = { features = ["cu124"] }
documents = { features = ["documents"], no-default-feature = true }

[tool.pixi.pypi-dependencies]
looped_transformer = { path = ".", editable = true }

[tool.pixi.feature.cu126.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu126" }

[tool.pixi.feature.cu124.pypi-dependencies]
torch = { version = "*", index = "https://download.pytorch.org/whl/cu124" }

[tool.pixi.feature.documents.dependencies]
python = ">=3.12,<3.14"
matplotlib-base = ">=3.11.2,<4"
tectonic = ">=0.15,<0.16"

[tool.pixi.feature.documents.tasks]
warmup-documents = "python scripts/warmup_documents.py"

[tool.pixi.dependencies]
python = ">=3.12,<3.14"
pixi-pycharm = ">=0.0.12,<0.0.13"
ruff = ">=0.16.10,<0.17"
transformers = ">=5.18.0,<6"
tokenizers = ">=0.23.1,<0.24"
pyrefly = ">=1.3.2,<2"
datasets = ">=5.0.1,<6"
pandas = ">=3.0.6,<4"
types-pyyaml = ">=6.0.12.20260906,<7"

[tool.pyrefly]
project-includes = ["src", "tests"]
project-excludes = [
    "**/__pycache__",
    ".pixi",
]
python-version = "3.13"

[tool.ruff]
target-version = "py313"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pixi.tasks]
typecheck = "pyrefly check"
format = "python -m ruff format ."
clean-data = "python scripts/clean_mnli.py data/mnli_train.tsv data/mnli_matched.tsv data/mnli_mismatched.tsv"
test = "python -m unittest discover -s tests -v"
train = "python -m looped_transformer.main --config-dir conf train"
